<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Profile | MarketLink – eGreen Basket</title>
    <meta name="description" content="Manage your customer account details, phone number, and residential address.">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">

    <!-- Main Navigation Bar -->
    <header id="main-navbar"></header>

    <div class="container-fluid py-4">
        <div class="row g-4">
            <!-- Sidebar -->
            <div class="col-lg-3 col-md-4">
                <div class="card p-3 shadow-sm border-0 sticky-top" style="top: 90px; border-radius: 16px;">
                    <div class="text-center p-3 border-bottom mb-3">
                        <div class="bg-success-subtle text-success rounded-circle mx-auto d-flex align-items-center justify-content-center mb-2" style="width: 58px; height: 58px; font-size: 1.4rem; font-weight: bold;">
                            <i class="bi bi-person-fill"></i>
                        </div>
                        <h6 class="fw-bold text-dark mb-0" id="prof-sidebar-name">Customer</h6>
                        <small class="text-muted" id="prof-sidebar-email">customer@marketlink.com</small>
                    </div>

                    <nav class="sidebar d-flex flex-column p-0">
                        <a href="dashboard.html" class="nav-link">
                            <i class="bi bi-speedometer2"></i> Overview
                        </a>
                        <a href="orders.html" class="nav-link">
                            <i class="bi bi-clock-history"></i> My Pre-Orders
                        </a>
                        <a href="favorites.html" class="nav-link">
                            <i class="bi bi-heart"></i> Saved Favorites
                        </a>
                        <a href="profile.html" class="nav-link active">
                            <i class="bi bi-person-gear"></i> Profile & Address
                        </a>
                        <hr class="my-2 text-muted">
                        <a href="../products.html" class="nav-link">
                            <i class="bi bi-basket"></i> Browse Products
                        </a>
                        <a href="../cart.html" class="nav-link">
                            <i class="bi bi-cart3"></i> My Basket
                        </a>
                    </nav>
                </div>
            </div>

            <!-- Profile Settings Panel -->
            <div class="col-lg-9 col-md-8">
                <div class="card p-4 border-0 shadow-sm mb-4" style="border-radius: 16px;">
                    <h3 class="fw-bold text-dark mb-1">Account & Profile Settings</h3>
                    <p class="text-muted small mb-4">Manage your contact number and pickup address information.</p>

                    <form id="profileForm" novalidate onsubmit="handleSaveProfile(event)">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-dark">Full Name <span class="text-danger">*</span></label>
                                <input type="text" id="profNameInput" class="form-control bg-light" required>
                                <div class="invalid-feedback"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-dark">Contact Phone <span class="text-danger">*</span></label>
                                <input type="tel" id="profPhoneInput" class="form-control bg-light" required>
                                <div class="invalid-feedback"></div>
                            </div>
                            <div class="col-md-12">
                                <label class="form-label small fw-bold text-dark">Email Address (Read-only)</label>
                                <input type="email" id="profEmailInput" class="form-control bg-light" readonly>
                            </div>
                            <div class="col-12">
                                <label class="form-label small fw-bold text-dark">Residential Address <span class="text-danger">*</span></label>
                                <input type="text" id="profAddressInput" class="form-control bg-light" required>
                                <div class="invalid-feedback"></div>
                            </div>
                        </div>

                        <div class="mt-4 pt-3 border-top d-flex gap-2">
                            <button type="submit" class="btn btn-primary px-4 fw-semibold">
                                <i class="bi bi-check-circle me-1"></i> Save Changes
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Password Update Card -->
                <div class="card p-4 border-0 shadow-sm" style="border-radius: 16px;">
                    <h5 class="fw-bold text-dark mb-1">Security & Password</h5>
                    <p class="text-muted small mb-3">Update your password to keep your pre-order account safe.</p>
                    <form id="passForm" novalidate onsubmit="handlePasswordUpdate(event)">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-dark">New Password <span class="text-danger">*</span></label>
                                <input type="password" id="newPassInput" class="form-control bg-light" minlength="6" placeholder="Min 6 characters" required>
                                <div class="invalid-feedback"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-dark">Confirm Password <span class="text-danger">*</span></label>
                                <input type="password" id="confirmPassInput" class="form-control bg-light" minlength="6" placeholder="Re-type new password" required>
                                <div class="invalid-feedback"></div>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-outline-primary btn-sm mt-3">
                            Update Password
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Footer -->
    <footer id="main-footer"></footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/validation.js"></script>
    <script src="../js/demo-data.js"></script>
    <script src="../js/db.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/chatbot.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (!Auth.requireAuth('customer')) return;
            App.renderNavbar('dashboard');
            App.renderFooter();

            const user = Auth.getCurrentUser();
            document.getElementById('prof-sidebar-name').textContent = user.name;
            document.getElementById('prof-sidebar-email').textContent = user.email;

            const nameEl = document.getElementById('profNameInput');
            const phoneEl = document.getElementById('profPhoneInput');
            const emailEl = document.getElementById('profEmailInput');
            const addrEl = document.getElementById('profAddressInput');

            nameEl.value = user.name || '';
            phoneEl.value = user.phone || '';
            emailEl.value = user.email || '';
            addrEl.value = user.address || '';

            nameEl.addEventListener('blur', () => {
                Validator.markField(nameEl, Validator.isValidName(nameEl.value), 'Name must be at least 3 letters.');
            });
            phoneEl.addEventListener('blur', () => {
                Validator.markField(phoneEl, Validator.isValidPhone(phoneEl.value), 'Enter a valid Pakistani phone number.');
            });
            addrEl.addEventListener('blur', () => {
                Validator.markField(addrEl, addrEl.value.trim().length >= 8, 'Address must be at least 8 characters.');
            });

            const p1 = document.getElementById('newPassInput');
            const p2 = document.getElementById('confirmPassInput');
            p1.addEventListener('blur', () => {
                Validator.markField(p1, Validator.isValidPassword(p1.value, 6), 'Password must be at least 6 characters.');
            });
            p2.addEventListener('blur', () => {
                Validator.markField(p2, p2.value === p1.value && p2.value.length > 0, 'Passwords do not match.');
            });
        });

        async function handleSaveProfile(e) {
            e.preventDefault();
            const nameEl = document.getElementById('profNameInput');
            const phoneEl = document.getElementById('profPhoneInput');
            const addrEl = document.getElementById('profAddressInput');

            const isNameValid = Validator.markField(nameEl, Validator.isValidName(nameEl.value), 'Name must be at least 3 letters.');
            const isPhoneValid = Validator.markField(phoneEl, Validator.isValidPhone(phoneEl.value), 'Enter a valid Pakistani phone number.');
            const isAddrValid = Validator.markField(addrEl, addrEl.value.trim().length >= 8, 'Address must be at least 8 characters.');

            if (!isNameValid || !isPhoneValid || !isAddrValid) {
                App.showToast('Please fix highlighted inputs before saving.', 'error');
                return;
            }

            const user = Auth.getCurrentUser();
            user.name = nameEl.value.trim();
            user.phone = phoneEl.value.trim();
            user.address = addrEl.value.trim();

            Auth.setSession(user);
            App.showToast('Profile information updated successfully!', 'success');
            setTimeout(() => location.reload(), 600);
        }

        function handlePasswordUpdate(e) {
            e.preventDefault();
            const p1 = document.getElementById('newPassInput');
            const p2 = document.getElementById('confirmPassInput');

            const isP1Valid = Validator.markField(p1, Validator.isValidPassword(p1.value, 6), 'Password must be at least 6 characters.');
            const isP2Valid = Validator.markField(p2, p2.value === p1.value && p2.value.length > 0, 'Passwords do not match.');

            if (!isP1Valid || !isP2Valid) {
                App.showToast('Please fix password errors.', 'error');
                return;
            }

            App.showToast('Password updated successfully.', 'success');
            p1.value = '';
            p2.value = '';
            Validator.clearField(p1);
            Validator.clearField(p2);
        }
    </script>
</body>
</html>
