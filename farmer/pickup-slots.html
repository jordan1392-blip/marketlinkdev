<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pickup Slots & Cutoff | MarketLink – eGreen Basket</title>
    <meta name="description" content="Configure weekly pickup hours, order caps, and advance cutoff windows for your stall.">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">

    <!-- Main Navigation Bar -->
    <header id="main-navbar"></header>

    <div class="container-fluid py-4">
        <div class="row g-4">
            <!-- Sidebar -->
            <div class="col-lg-3 col-md-4">
                <div class="card p-3 shadow-sm border-0 sticky-top" style="top: 90px; border-radius: 16px;">
                    <div class="text-center p-3 border-bottom mb-3">
                        <div class="bg-success-subtle text-success rounded-circle mx-auto d-flex align-items-center justify-content-center mb-2" style="width: 58px; height: 58px; font-size: 1.5rem; font-weight: bold;">
                            <i class="bi bi-shop"></i>
                        </div>
                        <h6 class="fw-bold text-dark mb-0">Farmer Portal</h6>
                        <small class="text-muted">Pickup Scheduling</small>
                    </div>

                    <nav class="sidebar d-flex flex-column p-0">
                        <a href="dashboard.html" class="nav-link">
                            <i class="bi bi-speedometer2"></i> Dashboard Overview
                        </a>
                        <a href="products.html" class="nav-link">
                            <i class="bi bi-basket"></i> My Products & Stock
                        </a>
                        <a href="orders.html" class="nav-link">
                            <i class="bi bi-bag-check"></i> Orders & Pickups
                        </a>
                        <a href="pickup-slots.html" class="nav-link active">
                            <i class="bi bi-calendar3"></i> Pickup Slots & Cutoff
                        </a>
                        <a href="profile.html" class="nav-link">
                            <i class="bi bi-person-gear"></i> Stall Profile Settings
                        </a>
                    </nav>
                </div>
            </div>

            <!-- Main Content Area -->
            <div class="col-lg-9 col-md-8">
                <!-- Add Pickup Slot Form -->
                <div class="card p-4 border-0 shadow-sm mb-4" style="border-radius: 16px;">
                    <h4 class="fw-bold text-dark mb-1">Schedule Weekly Pickup Windows</h4>
                    <p class="text-muted small mb-4">Define available collection slots and cutoff hours for customer pre-orders.</p>

                    <form onsubmit="FarmerPortal.addPickupSlot(event)">
                        <div class="row g-3">
                            <div class="col-md-3">
                                <label class="form-label small fw-bold text-dark">Market Day</label>
                                <select id="slotDayInput" class="form-select bg-light" required>
                                    <option value="Friday">Friday</option>
                                    <option value="Saturday">Saturday</option>
                                    <option value="Sunday">Sunday</option>
                                    <option value="Tuesday">Tuesday</option>
                                    <option value="Wednesday">Wednesday</option>
                                    <option value="Thursday">Thursday</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-bold text-dark">Time Window</label>
                                <input type="text" id="slotTimeInput" class="form-control bg-light" placeholder="e.g. 09:00 AM - 10:30 AM" required>
                            </div>
                            <div class="col-md-2">
                                <label class="form-label small fw-bold text-dark">Max Orders</label>
                                <input type="number" id="slotMaxInput" class="form-control bg-light" value="15" min="1" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label small fw-bold text-dark">Order Cutoff Time</label>
                                <input type="text" id="slotCutoffInput" class="form-control bg-light" value="4 hours before" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary mt-3 px-4 fw-semibold">
                            <i class="bi bi-plus-circle me-1"></i> Add Pickup Slot
                        </button>
                    </form>
                </div>

                <!-- Existing Pickup Slots Grid -->
                <div class="card p-4 border-0 shadow-sm" style="border-radius: 16px;">
                    <h5 class="fw-bold text-dark mb-3">Active Weekly Pickup Slots</h5>
                    <div class="row" id="farmer-slots-container">
                        <!-- Loaded dynamically via FarmerPortal.initPickupSlots() -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Footer -->
    <footer id="main-footer"></footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/demo-data.js"></script>
    <script src="../js/db.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/farmer.js"></script>
    <script src="../js/validation.js"></script>
    <script src="../js/chatbot.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (!Auth.requireAuth('farmer')) return;
            App.renderNavbar('dashboard');
            App.renderFooter();
            FarmerPortal.initPickupSlots();

            const timeInput = document.getElementById('slotTimeInput');
            const maxInput = document.getElementById('slotMaxInput');

            if (timeInput) {
                timeInput.addEventListener('input', () => {
                    const ok = timeInput.value.trim().length >= 5;
                    Validator.markField(timeInput, ok, 'Enter a valid time window (min 5 chars).');
                });
            }
            if (maxInput) {
                maxInput.addEventListener('input', () => {
                    const v = parseInt(maxInput.value, 10);
                    const ok = !isNaN(v) && v >= 1;
                    Validator.markField(maxInput, ok, 'Max orders must be at least 1.');
                });
            }
        });
    </script>
</body>
</html>
