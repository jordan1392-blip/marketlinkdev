<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stall Profile Settings | MarketLink – eGreen Basket</title>
    <meta name="description" content="Edit your farmer stall branding, bio, pickup window, and contact information.">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">

    <!-- Main Navigation Bar -->
    <header id="main-navbar"></header>

    <div class="container-fluid py-4">
        <div class="row g-4">
            <!-- Sidebar -->
            <div class="col-lg-3 col-md-4">
                <div class="card p-3 shadow-sm border-0 sticky-top" style="top: 90px; border-radius: 16px;">
                    <div class="text-center p-3 border-bottom mb-3">
                        <div class="bg-success-subtle text-success rounded-circle mx-auto d-flex align-items-center justify-content-center mb-2" style="width: 58px; height: 58px; font-size: 1.5rem; font-weight: bold;">
                            <i class="bi bi-shop"></i>
                        </div>
                        <h6 class="fw-bold text-dark mb-0">Farmer Portal</h6>
                        <small class="text-muted">Profile Settings</small>
                    </div>

                    <nav class="sidebar d-flex flex-column p-0">
                        <a href="dashboard.html" class="nav-link">
                            <i class="bi bi-speedometer2"></i> Dashboard Overview
                        </a>
                        <a href="products.html" class="nav-link">
                            <i class="bi bi-basket"></i> My Products & Stock
                        </a>
                        <a href="orders.html" class="nav-link">
                            <i class="bi bi-bag-check"></i> Orders & Pickups
                        </a>
                        <a href="pickup-slots.html" class="nav-link">
                            <i class="bi bi-calendar3"></i> Pickup Slots & Cutoff
                        </a>
                        <a href="profile.html" class="nav-link active">
                            <i class="bi bi-person-gear"></i> Stall Profile Settings
                        </a>
                    </nav>
                </div>
            </div>

            <!-- Profile Form -->
            <div class="col-lg-9 col-md-8">
                <div class="card p-4 border-0 shadow-sm" style="border-radius: 16px;">
                    <h3 class="fw-bold text-dark mb-1">Stall Branding & Operational Profile</h3>
                    <p class="text-muted small mb-4">Keep your market affiliation and stall timings up to date.</p>

                    <form onsubmit="handleSaveFarmerProfile(event)">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-dark">Stall / Business Name</label>
                                <input type="text" id="fpsStallName" class="form-control bg-light" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-dark">Contact Person Name</label>
                                <input type="text" id="fpsContactName" class="form-control bg-light" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-dark">Phone Number</label>
                                <input type="tel" id="fpsPhone" class="form-control bg-light" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-dark">Stall Email (Read-only)</label>
                                <input type="email" id="fpsEmail" class="form-control bg-light" readonly>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-dark">Operating Days</label>
                                <input type="text" id="fpsOperatingDays" class="form-control bg-light" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-dark">Primary Farmers Market</label>
                                <select id="fpsMarketSelect" class="form-select bg-light" required>
                                    <!-- Injected dynamically -->
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label small fw-bold text-dark">Farm / Stall Address</label>
                                <input type="text" id="fpsAddress" class="form-control bg-light" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label small fw-bold text-dark">Stall Profile Image URL</label>
                                <input type="url" id="fpsImageUrl" class="form-control bg-light">
                            </div>
                            <div class="col-12">
                                <label class="form-label small fw-bold text-dark">About Your Farm (Bio)</label>
                                <textarea id="fpsBio" rows="3" class="form-control bg-light"></textarea>
                            </div>
                        </div>

                        <div class="mt-4 pt-3 border-top">
                            <button type="submit" class="btn btn-primary px-4 fw-semibold">
                                <i class="bi bi-check-circle me-1"></i> Save Stall Details
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Footer -->
    <footer id="main-footer"></footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/demo-data.js"></script>
    <script src="../js/db.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/farmer.js"></script>
    <script src="../js/validation.js"></script>
    <script src="../js/chatbot.js"></script>

    <script>
        let currentFarmer = null;

        document.addEventListener('DOMContentLoaded', async () => {
            if (!Auth.requireAuth('farmer')) return;
            App.renderNavbar('dashboard');
            App.renderFooter();

            currentFarmer = await FarmerPortal.getFarmerSession();
            if (!currentFarmer) return;

            // Populate markets
            const markets = await DB.getMarkets();
            const mktSelect = document.getElementById('fpsMarketSelect');
            markets.forEach(m => {
                const isSelected = m.id === currentFarmer.market_id ? 'selected' : '';
                mktSelect.innerHTML += `<option value="${m.id}" ${isSelected}>${m.name}</option>`;
            });

            document.getElementById('fpsStallName').value = currentFarmer.stall_name || '';
            document.getElementById('fpsContactName').value = currentFarmer.contact_person || currentFarmer.farmer_name || '';
            document.getElementById('fpsPhone').value = currentFarmer.phone || '';
            document.getElementById('fpsEmail').value = currentFarmer.email || '';
            document.getElementById('fpsOperatingDays').value = currentFarmer.operating_days || 'Friday, Saturday';
            document.getElementById('fpsAddress').value = currentFarmer.address || '';
            document.getElementById('fpsImageUrl').value = currentFarmer.image_url || '';
            document.getElementById('fpsBio').value = currentFarmer.bio || '';

            // Real-time validation listeners
            const stallInput = document.getElementById('fpsStallName');
            const contactInput = document.getElementById('fpsContactName');
            const phoneInput = document.getElementById('fpsPhone');
            const addrInput = document.getElementById('fpsAddress');

            stallInput.addEventListener('input', () => {
                const ok = stallInput.value.trim().length >= 3;
                Validator.markField(stallInput, ok, 'Stall name must be at least 3 characters.');
            });
            contactInput.addEventListener('input', () => {
                const ok = Validator.isValidName(contactInput.value);
                Validator.markField(contactInput, ok, 'Enter a valid contact name (letters only, min 3 chars).');
            });
            phoneInput.addEventListener('input', () => {
                const ok = Validator.isValidPhone(phoneInput.value);
                Validator.markField(phoneInput, ok, 'Enter a valid Pakistani mobile number (e.g. 03001234567).');
            });
            addrInput.addEventListener('input', () => {
                const ok = addrInput.value.trim().length >= 5;
                Validator.markField(addrInput, ok, 'Please provide a full address (min 5 chars).');
            });
        });

        async function handleSaveFarmerProfile(e) {
            e.preventDefault();
            if (!currentFarmer) return;

            const stallInput = document.getElementById('fpsStallName');
            const contactInput = document.getElementById('fpsContactName');
            const phoneInput = document.getElementById('fpsPhone');
            const addrInput = document.getElementById('fpsAddress');
            const opDaysInput = document.getElementById('fpsOperatingDays');

            let isValid = true;
            if (stallInput.value.trim().length < 3) {
                Validator.markField(stallInput, false, 'Stall name must be at least 3 characters.');
                isValid = false;
            } else {
                Validator.markField(stallInput, true);
            }

            if (!Validator.isValidName(contactInput.value)) {
                Validator.markField(contactInput, false, 'Enter a valid contact name (letters only, min 3 chars).');
                isValid = false;
            } else {
                Validator.markField(contactInput, true);
            }

            if (!Validator.isValidPhone(phoneInput.value)) {
                Validator.markField(phoneInput, false, 'Enter a valid Pakistani mobile number (e.g. 03001234567).');
                isValid = false;
            } else {
                Validator.markField(phoneInput, true);
            }

            if (addrInput.value.trim().length < 5) {
                Validator.markField(addrInput, false, 'Please provide a full address (min 5 chars).');
                isValid = false;
            } else {
                Validator.markField(addrInput, true);
            }

            if (!opDaysInput.value.trim()) {
                Validator.markField(opDaysInput, false, 'Please specify operating days.');
                isValid = false;
            } else {
                Validator.markField(opDaysInput, true);
            }

            if (!isValid) {
                App.showToast('Please fix the errors in the form.', 'error');
                return;
            }

            const updatedData = {
                id: currentFarmer.id,
                stall_name: stallInput.value.trim(),
                contact_person: contactInput.value.trim(),
                farmer_name: contactInput.value.trim(),
                phone: phoneInput.value.trim(),
                operating_days: opDaysInput.value.trim(),
                market_id: document.getElementById('fpsMarketSelect').value,
                address: addrInput.value.trim(),
                image_url: document.getElementById('fpsImageUrl').value.trim() || currentFarmer.image_url,
                bio: document.getElementById('fpsBio').value.trim()
            };

            await DB.saveFarmer(updatedData);

            // Update session
            const user = Auth.getCurrentUser();
            user.stall_name = updatedData.stall_name;
            user.name = updatedData.contact_person;
            Auth.setSession(user);

            App.showToast('Stall details saved successfully!', 'success');
            setTimeout(() => location.reload(), 600);
        }
    </script>
</body>
</html>
