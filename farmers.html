<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmers Directory | MarketLink – eGreen Basket</title>
    <meta name="description" content="Meet verified local farmers and stall owners. Browse stalls, weekly harvest, operating schedules, and ratings.">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Main Navigation Bar -->
    <header id="main-navbar"></header>

    <!-- Page Header Banner -->
    <section class="py-4 bg-white border-bottom">
        <div class="container">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-2 small">
                    <li class="breadcrumb-item"><a href="index.html">Home</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Farmers</li>
                </ol>
            </nav>
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
                <div>
                    <h1 class="h2 fw-bold text-dark mb-1">Meet Our Local Farmers</h1>
                    <p class="text-muted mb-0">Certified organic growers, family orchards, and artisan food producers.</p>
                </div>
                <div>
                    <span class="badge bg-success-subtle text-success border border-success-subtle px-3 py-2 fs-6" id="farmer-count-badge">
                        Loading Farmers...
                    </span>
                </div>
            </div>
        </div>
    </section>

    <!-- Filter & Search Toolbar -->
    <section class="py-3">
        <div class="container">
            <div class="card p-3 border-0 shadow-sm bg-white">
                <div class="row g-3 align-items-center">
                    <div class="col-md-6">
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0">
                                <i class="bi bi-search text-muted"></i>
                            </span>
                            <input type="text" id="farmerSearchInput" class="form-control bg-light border-start-0" placeholder="Search farmer, stall name, or specialty...">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <select id="farmerMarketFilter" class="form-select bg-light">
                            <option value="all">All Farmers Markets</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Farmers Grid -->
    <section class="py-4">
        <div class="container">
            <div class="row g-4" id="farmers-grid">
                <!-- Dynamically loaded from DB -->
            </div>
        </div>
    </section>

    <!-- Main Footer -->
    <footer id="main-footer"></footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/demo-data.js"></script>
    <script src="js/db.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/app.js"></script>
    <script src="js/chatbot.js"></script>

    <script>
        let allFarmers = [];
        let allMarkets = [];

        document.addEventListener('DOMContentLoaded', async () => {
            App.renderNavbar('farmers');
            App.renderFooter();

            allFarmers = await DB.getFarmers();
            allMarkets = await DB.getMarkets();

            // Populate Market Select
            const mktSelect = document.getElementById('farmerMarketFilter');
            allMarkets.forEach(m => {
                mktSelect.innerHTML += `<option value="${m.id}">${m.name}</option>`;
            });

            // Check URL param ?market=ID
            const urlParams = new URLSearchParams(window.location.search);
            const initialMarket = urlParams.get('market');
            if (initialMarket) {
                mktSelect.value = initialMarket;
            }

            renderFarmers();

            document.getElementById('farmerSearchInput').addEventListener('input', renderFarmers);
            mktSelect.addEventListener('change', renderFarmers);
        });

        async function renderFarmers() {
            const container = document.getElementById('farmers-grid');
            const countBadge = document.getElementById('farmer-count-badge');
            const query = (document.getElementById('farmerSearchInput').value || '').toLowerCase().trim();
            const selectedMkt = document.getElementById('farmerMarketFilter').value;

            const user = Auth.getCurrentUser();
            let userFavs = [];
            if (user) {
                userFavs = await DB.getFavorites(user.id);
            }

            const filtered = allFarmers.filter(f => {
                const matchesQuery = !query || 
                    f.stall_name.toLowerCase().includes(query) || 
                    f.farmer_name.toLowerCase().includes(query) || 
                    (f.bio && f.bio.toLowerCase().includes(query));
                
                const matchesMarket = selectedMkt === 'all' || f.market_id === selectedMkt;
                return matchesQuery && matchesMarket;
            });

            countBadge.textContent = `${filtered.length} Farmers Listed`;

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <i class="bi bi-people text-muted display-4"></i>
                        <h5 class="fw-bold mt-3">No Farmers Found</h5>
                        <p class="text-muted">Try clearing the search or choosing another market.</p>
                    </div>
                `;
                return;
            }

            let html = '';
            filtered.forEach(f => {
                const mkt = allMarkets.find(m => m.id === f.market_id);
                const isFav = userFavs.some(fav => fav.item_type === 'farmer' && fav.item_id === f.id);

                html += `
                <div class="col-lg-4 col-md-6">
                    <div class="card h-100 card-hover-lift position-relative">
                        <div style="height: 180px; overflow: hidden; position: relative;">
                            <img src="${f.stall_image || f.image_url}" class="card-img-top w-100 h-100" style="object-fit: cover;" alt="${f.stall_name}">
                            <button class="fav-badge border-0" onclick="toggleFarmerFav(event, '${f.id}')" title="Save Favorite">
                                <i class="bi ${isFav ? 'bi-heart-fill' : 'bi-heart'}"></i>
                            </button>
                            <span class="badge bg-dark bg-opacity-75 position-absolute bottom-0 start-0 m-3">
                                <i class="bi bi-calendar3 me-1"></i> ${f.operating_days}
                            </span>
                        </div>
                        <div class="card-body p-4 d-flex flex-column">
                            <div class="d-flex align-items-center gap-3 mb-3">
                                <img src="${f.image_url}" alt="${f.farmer_name}" class="rounded-circle shadow-sm" style="width: 52px; height: 52px; object-fit: cover; border: 2px solid #2e7d32;">
                                <div>
                                    <h5 class="fw-bold mb-0 text-dark">${f.stall_name}</h5>
                                    <small class="text-success fw-semibold"><i class="bi bi-person-badge"></i> ${f.farmer_name}</small>
                                </div>
                            </div>

                            <p class="small text-muted mb-2">
                                <i class="bi bi-geo-alt-fill text-danger me-1"></i> ${mkt ? mkt.name : f.address}
                            </p>

                            <p class="small text-secondary mb-3 flex-grow-1">
                                ${f.bio ? f.bio.slice(0, 100) + '...' : 'Fresh produce grower supplying high quality harvest.'}
                            </p>

                            <div class="d-flex justify-content-between align-items-center pt-3 border-top mt-auto">
                                <div>${App.renderStars(f.rating)}</div>
                                <a href="farmer-profile.html?id=${f.id}" class="btn btn-outline-primary btn-sm px-3">
                                    View Profile <i class="bi bi-arrow-right ms-1"></i>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
                `;
            });

            container.innerHTML = html;
        }

        async function toggleFarmerFav(e, farmerId) {
            e.stopPropagation();
            const user = Auth.getCurrentUser();
            if (!user) {
                App.showToast('Please login to save favorite farmers.', 'info');
                return;
            }

            const isSaved = await DB.toggleFavorite(user.id, 'farmer', farmerId);
            App.showToast(isSaved ? 'Farmer saved to your favorites!' : 'Removed from favorites.', 'success');
            renderFarmers();
        }
    </script>
</body>
</html>
