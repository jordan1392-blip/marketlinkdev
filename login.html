<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | MarketLink – eGreen Basket</title>
    <meta name="description" content="Sign in to your MarketLink customer, farmer, or admin account.">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <!-- Main Navigation Bar -->
    <header id="main-navbar"></header>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-5">
                <div class="card p-4 p-md-5 border-0 shadow-lg" style="border-radius: 20px;">
                    <div class="text-center mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center bg-success-subtle text-success p-3 rounded-circle mb-3">
                            <i class="bi bi-box-arrow-in-right fs-1"></i>
                        </div>
                        <h2 class="fw-bold text-dark mb-1">Welcome Back</h2>
                        <p class="text-muted small">Access your pre-orders, farmer stall, or admin portal.</p>
                    <div id="login-auth-notice" class="d-none alert alert-success py-2 small mb-3 border-0 shadow-sm" style="border-radius: 10px;">
                        <i class="bi bi-basket me-1"></i> <strong>Pre-Order Checkout:</strong> Please log in to complete your market pre-order.
                    </div>

                    <!-- Quick 1-Click Demo Login Panel (Ideal for evaluation!) -->
                    <div class="card p-3 mb-4 border bg-white shadow-sm" style="border-radius: 12px;">
                        <span class="small fw-bold text-success mb-2 d-flex align-items-center gap-1">
                            <i class="bi bi-lightning-charge-fill"></i> Quick Demo Access (1-Click Test)
                        </span>
                        <div class="d-flex flex-column gap-2">
                            <button type="button" class="btn btn-outline-success btn-sm text-start d-flex justify-content-between align-items-center py-2 px-3" onclick="quickLogin('customer@marketlink.com')">
                                <span><i class="bi bi-person me-2"></i> Demo Customer (Hamza Farooq)</span>
                                <span class="badge bg-success-subtle text-success border border-success-subtle">Customer</span>
                            </button>
                            <button type="button" class="btn btn-outline-primary btn-sm text-start d-flex justify-content-between align-items-center py-2 px-3" onclick="quickLogin('farmer@marketlink.com')">
                                <span><i class="bi bi-shop me-2"></i> Demo Farmer (GreenValley Organic)</span>
                                <span class="badge bg-primary-subtle text-primary border border-primary-subtle">Farmer</span>
                            </button>
                            <button type="button" class="btn btn-outline-dark btn-sm text-start d-flex justify-content-between align-items-center py-2 px-3" onclick="quickLogin('admin@marketlink.com')">
                                <span><i class="bi bi-shield-lock me-2"></i> Demo Administrator</span>
                                <span class="badge bg-dark-subtle text-dark border">Admin</span>
                            </button>
                        </div>
                    </div>

                    <div class="position-relative text-center mb-4">
                        <hr class="text-muted">
                        <span class="position-absolute top-50 start-50 translate-middle bg-white px-3 small text-muted">Or sign in with email</span>
                    </div>

                    <!-- Standard Login Form -->
                    <form id="loginForm" novalidate onsubmit="handleLoginSubmit(event)">
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-dark">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                                <input type="email" id="loginEmail" class="form-control bg-light border-start-0" placeholder="name@example.com" required>
                                <div class="invalid-feedback"></div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-bold text-dark">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                                <input type="password" id="loginPassword" class="form-control bg-light border-start-0" placeholder="••••••••" value="demo123" required>
                                <div class="invalid-feedback"></div>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-3 fw-bold mb-3 shadow-sm">
                            Sign In to Account
                        </button>
                    </form>

                    <div class="text-center small text-muted">
                        Don't have an account yet? <a href="register.html" class="fw-bold text-success">Register Here</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Footer -->
    <footer id="main-footer"></footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/validation.js"></script>
    <script src="js/demo-data.js"></script>
    <script src="js/db.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/app.js"></script>
    <script src="js/chatbot.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            App.renderNavbar('login');
            App.renderFooter();

            // Check if redirected from cart/checkout
            const redirectNotice = document.getElementById('login-auth-notice');
            if (sessionStorage.getItem('ml_auth_redirect')) {
                if (redirectNotice) redirectNotice.classList.remove('d-none');
            }

            // If already logged in, redirect
            const user = Auth.getCurrentUser();
            if (user) {
                const targetUrl = sessionStorage.getItem('ml_auth_redirect');
                if (targetUrl) {
                    sessionStorage.removeItem('ml_auth_redirect');
                    window.location.href = targetUrl;
                    return;
                }
                if (user.role === 'customer') window.location.href = 'customer/dashboard.html';
                else if (user.role === 'farmer') window.location.href = 'farmer/dashboard.html';
                else if (user.role === 'admin') window.location.href = 'admin/dashboard.html';
            }

            const emailEl = document.getElementById('loginEmail');
            const passEl = document.getElementById('loginPassword');

            emailEl.addEventListener('blur', () => {
                Validator.markField(emailEl, Validator.isValidEmail(emailEl.value), 'Please enter a valid email address.');
            });
            passEl.addEventListener('blur', () => {
                Validator.markField(passEl, passEl.value.length >= 4, 'Please enter your account password.');
            });
        });

        async function quickLogin(email) {
            document.getElementById('loginEmail').value = email;
            document.getElementById('loginPassword').value = 'demo123';
            Validator.clearField(document.getElementById('loginEmail'));
            Validator.clearField(document.getElementById('loginPassword'));
            await doLogin(email, 'demo123');
        }

        async function handleLoginSubmit(e) {
            e.preventDefault();
            const emailEl = document.getElementById('loginEmail');
            const passEl = document.getElementById('loginPassword');

            const isEmailValid = Validator.markField(emailEl, Validator.isValidEmail(emailEl.value), 'Please enter a valid email address.');
            const isPassValid = Validator.markField(passEl, passEl.value.length >= 4, 'Please enter your password.');

            if (!isEmailValid || !isPassValid) {
                App.showToast('Please correct the highlighted inputs.', 'error');
                return;
            }

            await doLogin(emailEl.value, passEl.value);
        }

        async function doLogin(email, password) {
            const res = await Auth.login(email, password);
            if (res.success) {
                App.showToast(`Welcome back, ${res.user.name}! Redirecting...`, 'success');
                setTimeout(() => {
                    const targetUrl = sessionStorage.getItem('ml_auth_redirect');
                    if (targetUrl) {
                        sessionStorage.removeItem('ml_auth_redirect');
                        window.location.href = targetUrl;
                    } else {
                        window.location.href = res.redirect;
                    }
                }, 600);
            } else {
                App.showToast(res.message || 'Login failed.', 'error');
                Validator.markField(document.getElementById('loginEmail'), false, res.message);
            }
        }
    </script>
</body>
</html>
