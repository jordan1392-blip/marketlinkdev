<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmers Markets | MarketLink – eGreen Basket</title>
    <meta name="description" content="Discover farmers markets across Pakistan. View operating days, timings, stall counts and interactive OpenStreetMap directions.">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Leaflet CSS for OpenStreetMap -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Main Navigation Bar -->
    <header id="main-navbar"></header>

    <!-- Page Header Banner -->
    <section class="py-4 bg-white border-bottom">
        <div class="container">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-2 small">
                    <li class="breadcrumb-item"><a href="index.html">Home</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Farmers Markets</li>
                </ol>
            </nav>
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
                <div>
                    <h1 class="h2 fw-bold text-dark mb-1">Local Farmers Markets</h1>
                    <p class="text-muted mb-0">Explore physical weekend bazaars and mid-week farm hubs across Pakistan.</p>
                </div>
                <div>
                    <span class="badge bg-success-subtle text-success border border-success-subtle px-3 py-2 fs-6" id="market-count-badge">
                        Loading Markets...
                    </span>
                </div>
            </div>
        </div>
    </section>

    <!-- Interactive Map Section -->
    <section class="py-4">
        <div class="container">
            <div class="card p-2 border shadow-sm">
                <div class="d-flex justify-content-between align-items-center px-3 py-2">
                    <h6 class="fw-bold mb-0 text-dark d-flex align-items-center gap-2">
                        <i class="bi bi-map text-success fs-5"></i> Interactive OpenStreetMap Directory
                    </h6>
                    <small class="text-muted">Click markers to inspect market timings & farmers</small>
                </div>
                <div id="market-map"></div>
            </div>
        </div>
    </section>

    <!-- Filter & Search Toolbar -->
    <section class="py-3">
        <div class="container">
            <div class="card p-3 border-0 shadow-sm bg-white">
                <div class="row g-3 align-items-center">
                    <div class="col-md-5">
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0">
                                <i class="bi bi-search text-muted"></i>
                            </span>
                            <input type="text" id="marketSearchInput" class="form-control bg-light border-start-0" placeholder="Search market name or address...">
                        </div>
                    </div>
                    <div class="col-md-3 col-sm-6">
                        <select id="marketCitySelect" class="form-select bg-light">
                            <option value="all">All Cities</option>
                            <option value="Islamabad">Islamabad</option>
                            <option value="Lahore">Lahore</option>
                            <option value="Karachi">Karachi</option>
                            <option value="Rawalpindi">Rawalpindi</option>
                            <option value="Peshawar">Peshawar</option>
                        </select>
                    </div>
                    <div class="col-md-4 col-sm-6">
                        <select id="marketDaySelect" class="form-select bg-light">
                            <option value="all">All Operating Days</option>
                            <option value="Friday">Friday Markets</option>
                            <option value="Saturday">Saturday Markets</option>
                            <option value="Sunday">Sunday Markets</option>
                            <option value="Tuesday">Tuesday Markets</option>
                            <option value="Wednesday">Wednesday Markets</option>
                            <option value="Thursday">Thursday Markets</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Markets Cards Grid -->
    <section class="py-4">
        <div class="container">
            <div class="row" id="markets-grid">
                <!-- Dynamically loaded from DB via js/markets.js -->
            </div>
        </div>
    </section>

    <!-- Main Footer -->
    <footer id="main-footer"></footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/config.js"></script>
    <script src="js/demo-data.js"></script>
    <script src="js/db.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/app.js"></script>
    <script src="js/markets.js"></script>
    <script src="js/chatbot.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            App.renderNavbar('markets');
            App.renderFooter();
            MarketsView.init();
        });
    </script>
</body>
</html>
